name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      LEFTHOOK: 0 # o commit de versão do changesets/action não deve passar pelo commitlint local
      TURBO_TELEMETRY_DISABLED: 1
      TURBO_SCM_BASE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      - run: pnpm lint

      - run: pnpm turbo run typecheck test:coverage --affected

      # Abre/atualiza o PR "Version Packages" quando há changesets pendentes.
      # Quando esse PR é mergeado (sem changesets pendentes), publica no npm só os pacotes cuja
      # versão ainda não existe lá (o Changesets compara com o registro) e só compila `packages/*`.
      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm run version
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # Sem changesets pendentes é a rodada de publicação: cria a tag e o GitHub Release de cada
      # pacote que acabou de ser publicado (ver o script, que explica por que não é a action).
      - name: GitHub Release
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: .github/scripts/github-release.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
