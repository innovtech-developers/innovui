name: Deploy site

# Dispara só depois que o workflow CI passar na main (não o push em si),
# para nunca re-deployar um commit quebrado.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy webhook
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            "${{ secrets.COOLIFY_WEBHOOK }}"
