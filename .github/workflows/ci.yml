name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Na main nada é cancelado: o deploy do site decide pelo diff de cada commit, e um CI cancelado
  # faria o deploy pular a mudança daquele commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1
      # O Turborepo só roda typecheck/test/build nos pacotes que mudaram (e nos que dependem deles):
      # no PR, desde a base; no push na main, desde o commit anterior.
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o --affected precisa do histórico para comparar com a base

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      - run: pnpm lint

      - run: pnpm turbo run typecheck test:coverage build --affected
